<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>长篇场景验证</title><script src="../src/journey-data.js"></script><script src="../src/journey-core.js"></script><style>body{font:16px/1.8 system-ui;background:#15352c;color:#d9dbc0;margin:40px;max-width:850px}button{background:#c7d2a4;border:0;padding:12px 18px;margin:6px;cursor:pointer;border-radius:5px}#buttons{display:grid;grid-template-columns:1fr 1fr}</style><h1>长夜与归途 · 场景验证</h1><p>仅可在 localhost 使用。测试存档与 127.0.0.1 玩家存档相互独立。</p><div id="buttons"></div><pre id="result"></pre><script>
const D=MosslightJourneyData,C=MosslightJourney;
function clearBattle(g){let guard=0;while(g.combat&&guard++<12){for(const e of g.enemies)if(e.alive&&e.battleId)g.hitEnemy(e,99999,{element:'lightning'});g.step(.01,{});}if(g.combat)throw Error('Battle failed to clear');}
function finishNode(g,n){g.player.x=n.x;g.player.y=n.y;if(!g.beginNode(n.id))throw Error('Cannot begin '+n.id);clearBattle(g);const result=g.resolveNode(n.id,{answer:n.puzzle?.solution,choice:n.choices?.[0]?.id});if(!result.ok)throw Error(result.message);}
function prepare(kind,chapterIndex=0){try{if(location.hostname!=='localhost')throw Error('Use localhost to isolate test saves');const g=new C.Campaign();for(let i=0;i<chapterIndex;i++){for(const n of D.CHAPTERS[i].nodes)finishNode(g,n);g.travel(i+1);}let node=D.CHAPTERS[chapterIndex].nodes[0];if(['puzzle','battle','choice'].includes(kind)){node=D.CHAPTERS[chapterIndex].nodes.find(n=>kind==='puzzle'?n.type==='puzzle':kind==='battle'?['battle','boss','defend'].includes(n.type):n.choices?.length);for(const n of D.CHAPTERS[chapterIndex].nodes){if(n.id===node.id)break;finishNode(g,n);}}
if(kind==='ending'){for(const n of D.CHAPTERS[chapterIndex].nodes.slice(0,-1))finishNode(g,n);node=D.CHAPTERS[chapterIndex].nodes.at(-1);g.player.x=node.x;g.player.y=node.y;g.beginNode(node.id);clearBattle(g);}else if(kind==='camp'){g.player.x=220;g.player.y=1300;}else{g.player.x=node.x;g.player.y=node.y+35;}
g.events=[];localStorage.setItem('mosslight-long-campaign-v1',JSON.stringify(g.serialize()));location.href='../journey.html';}catch(e){document.getElementById('result').textContent=e.stack;}}
for(const [label,kind,c]of [['首章开场','node',0],['音乐线索谜题','puzzle',1],['矿井战斗','battle',3],['苏晚的选择','choice',2],['海港风景','node',4],['霜夜记忆塔','node',6],['营地与成长','camp',1],['最终演出','ending',7]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>prepare(kind,c);document.getElementById('buttons').append(b);}
</script></html>
